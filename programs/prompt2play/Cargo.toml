[package]
name = "prompt2play"
version = "0.1.0"
description = "Ownable puzzle levels with on-chain replay verification"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "prompt2play"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }

[dev-dependencies]
litesvm = "0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
